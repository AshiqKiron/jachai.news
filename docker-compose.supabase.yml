# API + Redis + Celery — news Postgres is your hosted Supabase database (see docs/DATABASE.md).
# Requires backend/.env with DATABASE_POOLER_URL (or DATABASE_URL) + DATABASE_POOL_MODE=pgbouncer.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    ports:
      - "3001:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      INGEST_ASYNC_ENABLED: "true"
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: >
      celery -A app.workers.celery_app worker
      -Q ingest,verification
      -l info
      --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat -l info
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      INGEST_SCHEDULER_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy